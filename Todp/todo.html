<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>
    <style>
      /* 1.CSS (見た目の設定) */
      body {
        text-align: center;
        margin-top: 100px;
        font-family: sans-serif;
      }
      #result {
        font-size: 40px;
        font-weight: bold;
        margin: 20px 0;
      }
      button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
      }
      /* 新しく追加したラッキーアイテム用のCSS */
      #lucky-item {
        font-size: 20px;
        color: gray;
        margin-bottom: 30px;
      }
      button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- 2. HTML（画面の骨組み） -->
    <h1>今日の一言おみくじ</h1>
    <p id="result">ボタンを押してね</p>
    <!-- 追加 ラッキーアイテムを表示する場所-->
    <p id="lucky-item"></p>
    <button id="draw-btn">おみくじを引く</button>

    <!-- 3. JavaScriptファイルの読み込み -->
    <script src="todo.js"></script>
  </body>
</html>
